# Forwarded headers: see docs/DEPLOYMENT.md#forwarded-headers

map $http_x_forwarded_host $proxy_x_forwarded_host {
    default $http_x_forwarded_host;
    ""      $host;
}

map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Access log: the visitor is the header, not the peer, for the same reason the
# limiter keys on it. $uri rather than $request on purpose - /oauth-redirect
# carries the JWT as a query parameter and $request would write a usable token
# into the log. See docs/DEPLOYMENT.md#the-access-log.
log_format access '$remote_addr -> $http_cf_connecting_ip [$time_local] '
                  '"$request_method $uri" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent"';

# Rate limiting: keys, budgets and the trust argument live in
# docs/DEPLOYMENT.md#rate-limiting. Never key on $remote_addr here: behind the
# tunnel that is the cloudflared container, the same value for every visitor.
map $http_cf_connecting_ip $limit_key {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

# Strict, because a login attempt costs a BCrypt comparison.
limit_req_zone $limit_key zone=auth_zone:1m rate=10r/m;
# A flood ceiling for the API, not a per-user quota: the SPA fires several
# requests on boot and any of them may be a 5MB upload.
limit_req_zone $limit_key zone=api_zone:1m rate=30r/s;
# Images are unauthenticated and legitimately bursty. A rate, not limit_conn:
# connection limits would count the tunnel's connections, not the visitor's.
limit_req_zone $limit_key zone=img_zone:1m rate=50r/s;

# 429, not nginx's 503 default - the SPA reads >=500 as a server fault, and
# src/api/lib/axios.js has a branch for a throttle.
limit_req_status 429;
limit_req_log_level warn;

# Only a peer inside the tunnel's network may declare a visitor address.
# Uncomment with the subnet from `docker network inspect <network>`; an
# unmatched subnet silently counts every visitor as the tunnel.
# set_real_ip_from <cloudflared subnet>;
# real_ip_header CF-Connecting-IP;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Server-level, so it replaces the image's http-level log instead of adding a
    # second line to the same file. See docs/DEPLOYMENT.md#the-access-log.
    access_log /var/log/nginx/access.log access;

    # Sizing: see docs/DEPLOYMENT.md#what-each-location-is-for
    client_max_body_size 10M;

    # Shared defaults: see docs/DEPLOYMENT.md#forwarded-headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $proxy_x_forwarded_host;

    # Upstream re-resolution: see docs/DEPLOYMENT.md#upstream-re-resolution
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $upstream backend:8080;

    # The login endpoint alone, so the strict zone is not shared with
    # /api/auth/me, which the SPA calls on every boot.
    location = /api/auth/login {
        limit_req zone=auth_zone burst=5 nodelay;
        proxy_pass http://$upstream;
    }

    # /api/auth/me and /api/auth/oauth-init: the general ceiling is enough.
    location /api/auth/ {
        limit_req zone=api_zone burst=60 nodelay;
        proxy_pass http://$upstream;
    }

    location /api/ {
        limit_req zone=api_zone burst=60 nodelay;
        proxy_pass http://$upstream;
    }

    # Handshake: see docs/DEPLOYMENT.md#forwarded-headers
    location /oauth2/ {
        limit_req zone=api_zone burst=20 nodelay;
        proxy_pass http://$upstream;
    }

    location /login/oauth2/ {
        limit_req zone=api_zone burst=20 nodelay;
        proxy_pass http://$upstream;
    }

    # Uploaded images are unauthenticated and read from disk.
    # Rate limiting: see docs/DEPLOYMENT.md#rate-limiting
    location /images/ {
        limit_req zone=img_zone burst=100 nodelay;
        proxy_pass http://$upstream;
    }

    # /logout is an SPA route and must not be proxied: see
    # docs/DEPLOYMENT.md#what-each-location-is-for
    location / {
        try_files $uri $uri/ /index.html;
    }
}
