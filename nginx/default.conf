# Forwarded headers: see docs/DEPLOYMENT.md#forwarded-headers

map $http_x_forwarded_host $proxy_x_forwarded_host {
    default $http_x_forwarded_host;
    ""      $host;
}

map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sizing: see docs/DEPLOYMENT.md#what-each-location-is-for
    client_max_body_size 10M;

    # Shared defaults: see docs/DEPLOYMENT.md#forwarded-headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $proxy_x_forwarded_host;

    # Upstream re-resolution: see docs/DEPLOYMENT.md#upstream-re-resolution
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $upstream backend:8080;

    location /api/ {
        proxy_pass http://$upstream;
    }

    # Handshake: see docs/DEPLOYMENT.md#forwarded-headers
    location /oauth2/ {
        proxy_pass http://$upstream;
    }

    location /login/oauth2/ {
        proxy_pass http://$upstream;
    }

    location /images/ {
        proxy_pass http://$upstream;
    }

    # /logout is an SPA route and must not be proxied: see
    # docs/DEPLOYMENT.md#what-each-location-is-for
    location / {
        try_files $uri $uri/ /index.html;
    }
}
