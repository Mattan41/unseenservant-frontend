<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unseen Servant</title>
    <!--
      Resolves theme + mode before the bundle is fetched, so the first paint is
      already correct (no flash of the wrong palette). Mirrors the resolution in
      src/utils/environment.js; the value lists are duplicated on purpose —
      this must run synchronously, before any module import. data-env is set
      later by main.js, since it is a build-time constant.
    -->
    <script>
      ;(function () {
        var root = document.documentElement
        var theme = 'silver'
        var mode = 'light'
        try {
          var storedTheme = localStorage.getItem('theme')
          if (storedTheme === 'silver' || storedTheme === 'forest') theme = storedTheme
          var storedMode = localStorage.getItem('mode')
          if (storedMode === 'light' || storedMode === 'dark') {
            mode = storedMode
          } else if (
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
          ) {
            mode = 'dark'
          }
        } catch (e) {}
        root.setAttribute('data-theme', theme)
        root.setAttribute('data-mode', mode)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
